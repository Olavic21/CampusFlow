# ─────────────────────────────────────────────────────────────────────────────
# CampusFlow — services de données en conteneurs (ALTERNATIVE au PostgreSQL natif)
#
# Chemin recommandé : deploy/oracle/setup-vm.sh (PostgreSQL + PostGIS natifs).
# Ce fichier sert si vous préférez Docker pour la base et le cache sur la VM :
#
#   cd /opt/campusflow
#   sudo docker compose -f deploy/oracle/docker-compose.prod.yml up -d
#
# Les ports sont publiés sur 127.0.0.1 uniquement : PostgreSQL et Redis ne sont
# JAMAIS exposés sur Internet. Le backend (systemd ou conteneur) y accède en local.
#
# Pré-requis : créer deploy/oracle/.env.db (non versionné) depuis .env.db.example
# ─────────────────────────────────────────────────────────────────────────────
name: campusflow-data

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: campusflow-db
    restart: unless-stopped
    env_file:
      - .env.db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - campusflow_pgdata:/var/lib/postgresql/data
      - ../../data/db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campusflow-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - campusflow_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  campusflow_pgdata:
  campusflow_redisdata:
