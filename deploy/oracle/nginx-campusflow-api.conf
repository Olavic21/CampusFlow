# ─────────────────────────────────────────────────────────────────────────────
# CampusFlow — reverse proxy Nginx pour l'API (Oracle Cloud VM)
#
# Installation :
#   sudo cp deploy/oracle/nginx-campusflow-api.conf /etc/nginx/sites-available/campusflow-api
#   sudo sed -i 's/API_DOMAIN_PLACEHOLDER/<votre-domaine>/g' /etc/nginx/sites-available/campusflow-api
#   sudo ln -sf /etc/nginx/sites-available/campusflow-api /etc/nginx/sites-enabled/campusflow-api
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS : le script setup-vm.sh lance certbot, qui réécrit ce fichier et ajoute
# l'écoute 443 + la redirection 80 → 443.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name API_DOMAIN_PLACEHOLDER;

    # Upload d'avatar limité à 5 Mo par l'API → 8 Mo de marge
    client_max_body_size 8m;
    client_body_timeout 30s;

    # En-têtes de sécurité de base
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/campusflow-api.access.log;
    error_log  /var/log/nginx/campusflow-api.error.log;

    # ── WebSocket temps réel : /ws/live-occupancy/ ───────────────────────────
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Compatibilité : /api/<route> → /<route> ──────────────────────────────
    # Utile si VITE_API_URL se termine par /api (convention du proxy Vite).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Médias (avatars WebP) servis par FastAPI StaticFiles ─────────────────
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── API REST (racine : /health, /locations, /flux/live, ...) ─────────────
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
