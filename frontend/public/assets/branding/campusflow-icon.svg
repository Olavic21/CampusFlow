<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="badgeGrad" x1="60" y1="40" x2="452" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A8CFF"/>
      <stop offset="0.55" stop-color="#1E5FE0"/>
      <stop offset="1" stop-color="#0B2E7A"/>
    </linearGradient>
    <radialGradient id="glossHi" cx="0.32" cy="0.24" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="buildGrad" x1="200" y1="190" x2="312" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E5FE0"/>
      <stop offset="1" stop-color="#0B2E7A"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="180" y1="0" x2="332" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FD8FF"/>
      <stop offset="1" stop-color="#2F8CFF"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#04173F" flood-opacity="0.35"/>
    </filter>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- badge base -->
  <circle cx="256" cy="256" r="248" fill="url(#badgeGrad)"/>
  <circle cx="256" cy="256" r="248" fill="url(#glossHi)"/>

  <!-- orbiting data-sync ring -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="#BFE0FF" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="2 10"/>
  <circle cx="256" cy="42" r="6" fill="#8FD3FF" filter="url(#nodeGlow)"/>
  <circle cx="466" cy="300" r="4.5" fill="#8FD3FF" filter="url(#nodeGlow)" opacity="0.85"/>
  <circle cx="80" cy="360" r="4" fill="#8FD3FF" filter="url(#nodeGlow)" opacity="0.7"/>

  <!-- location pin -->
  <path filter="url(#softShadow)" d="M256,112
           C196,112 152,159 152,218
           C152,276 206,332 256,400
           C306,332 360,276 360,218
           C360,159 316,112 256,112 Z"
        fill="#FFFFFF"/>

  <!-- ghost / twin wireframe of the building, offset for "digital twin" hologram effect -->
  <g transform="translate(14,-10)" opacity="0.35">
    <rect x="205" y="228" width="102" height="76" rx="3" fill="none" stroke="#2F8CFF" stroke-width="2.2" stroke-dasharray="4 5"/>
    <rect x="243" y="196" width="26" height="34" fill="none" stroke="#2F8CFF" stroke-width="2.2" stroke-dasharray="4 5"/>
  </g>

  <!-- building -->
  <g>
    <!-- side pillars -->
    <rect x="203" y="232" width="13" height="72" rx="2" fill="url(#buildGrad)"/>
    <rect x="296" y="232" width="13" height="72" rx="2" fill="url(#buildGrad)"/>
    <!-- main hall -->
    <rect x="210" y="232" width="92" height="72" rx="3" fill="url(#buildGrad)"/>
    <!-- roof tower -->
    <rect x="244" y="200" width="24" height="34" rx="2" fill="url(#buildGrad)"/>
    <!-- flagpole + signal flag -->
    <line x1="256" y1="200" x2="256" y2="176" stroke="#0B2E7A" stroke-width="3" stroke-linecap="round"/>
    <path d="M256,176 L280,183 L256,190 Z" fill="url(#flowGrad)"/>

    <!-- windows -->
    <rect x="220" y="248" width="13" height="13" rx="2" fill="#FFFFFF"/>
    <rect x="279" y="248" width="13" height="13" rx="2" fill="#FFFFFF"/>
    <!-- door -->
    <path d="M244,304 L244,278 C244,270 268,270 268,278 L268,304 Z" fill="#FFFFFF"/>

    <!-- sensor / IoT nodes with connecting lines (digital-twin data layer) -->
    <g stroke="#7FD8FF" stroke-width="1.4" opacity="0.9">
      <line x1="210" y1="232" x2="302" y2="304"/>
      <line x1="302" y1="232" x2="210" y2="304"/>
    </g>
    <circle cx="210" cy="232" r="4.5" fill="#7FD8FF" filter="url(#nodeGlow)"/>
    <circle cx="302" cy="232" r="4.5" fill="#7FD8FF" filter="url(#nodeGlow)"/>
    <circle cx="210" cy="304" r="4.5" fill="#7FD8FF" filter="url(#nodeGlow)"/>
    <circle cx="302" cy="304" r="4.5" fill="#7FD8FF" filter="url(#nodeGlow)"/>
  </g>

  <!-- flow waves beneath the building, inside the pin -->
  <path d="M198,344 C214,332 228,356 244,344 C260,332 274,356 290,344 C298,338 306,340 314,344"
        fill="none" stroke="url(#flowGrad)" stroke-width="5" stroke-linecap="round"/>
  <path d="M204,362 C218,353 230,371 244,362 C258,353 270,371 284,362"
        fill="none" stroke="url(#flowGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
</svg>
