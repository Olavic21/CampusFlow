<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="CampusFlow Lite">
  <defs>
    <linearGradient id="cf-sky" x1="10" y1="10" x2="110" y2="110">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="cf-path" x1="30" y1="75" x2="95" y2="45">
      <stop stop-color="#22C55E"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="cf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#cf-sky)"/>
  <!-- Chemin intelligent -->
  <path d="M28 82 C45 58, 55 72, 72 48 S 92 38, 96 32" stroke="url(#cf-path)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#cf-glow)"/>
  <polygon points="92,32 98,28 94,38" fill="#22C55E"/>
  <!-- Bâtiment -->
  <path d="M44 78 L60 52 L76 78 Z" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <rect x="50" y="62" width="20" height="16" rx="3" fill="rgba(255,255,255,0.95)"/>
  <rect x="54" y="66" width="5" height="5" rx="1" fill="#2563EB" opacity="0.5"/>
  <rect x="61" y="66" width="5" height="5" rx="1" fill="#2563EB" opacity="0.5"/>
  <!-- Repère GPS -->
  <circle cx="60" cy="44" r="14" fill="#22C55E" stroke="#fff" stroke-width="3"/>
  <circle cx="60" cy="44" r="5" fill="#fff"/>
  <path d="M60 34 L60 24 M60 54 L60 64 M50 44 L40 44 M70 44 L80 44" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
</svg>
